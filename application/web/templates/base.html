<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DataGuard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a href="/" class="brand">DataGuard</a>
      <span class="tag">CSV data-quality auditor</span>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>DataGuard &mdash; reads a CSV, profiles its quality, never modifies your file.</p>
    </div>
  </footer>
</body>
</html>
